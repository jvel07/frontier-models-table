name: Weekly sweep

# The judgement half of keeping the atlas current.
#
# watch-sources.yml finds what changed; this reads those findings, researches them,
# and opens a pull request. It runs Claude Code headless on the runner rather than
# as a scheduled session elsewhere for one concrete reason: the runner has ordinary
# internet access, so the agent can open a lab's technical report and a model's
# config.json itself. An agent sandbox usually cannot, and an agent that cannot read
# primary sources is exactly the wrong thing to point at this repository.
#
# It opens a pull request and never pushes to main. Every model field in this project
# is there because a person judged it sourced; that property is the whole reason the
# site is citable, and no schedule is allowed to erode it.

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      focus:
        description: "Optional: a specific model or lab to look at this run"
        required: false
        type: string
      model:
        description: "Model for the run. sonnet is the default and is ~40% cheaper per token; escalate deliberately."
        required: false
        default: sonnet
        type: choice
        options: [sonnet, opus]

permissions:
  contents: write
  pull-requests: write
  issues: read

concurrency:
  group: weekly-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    # Without a key the job would burn a runner to fail at the last step; skip early.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.ENABLE_WEEKLY_SWEEP == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - run: npm ci

      - name: Install Chromium for the verify suites
        run: npx playwright install --with-deps chromium

      - name: Collect the current findings
        id: findings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The source-check issue is the agent's list of leads. Absent is fine —
          # that just means the last automated run found nothing.
          gh issue list --label source-check --state open --limit 1 \
            --json number,title,body > findings.json || echo '[]' > findings.json
          echo "count=$(jq length findings.json)" >> "$GITHUB_OUTPUT"

      - name: Install Claude Code
        run: npm i -g @anthropic-ai/claude-code

      - name: Sweep
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          FOCUS: ${{ inputs.focus }}
          SWEEP_MODEL: ${{ inputs.model || 'sonnet' }}
        run: |
          set -euo pipefail
          BRANCH="sweep/$(date -u +%Y-%m-%d)"
          git config user.name  "model-atlas-bot"
          git config user.email "noreply@anthropic.com"
          git checkout -b "$BRANCH"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

          # --output-format json so the run reports what it cost. The first billed
          # run cost $5 for one model and nobody could see why until afterwards;
          # a number in the log is what makes the next tuning pass evidence-based.
          # A failed agent run is exactly when that number matters most, so the
          # exit code is captured instead of aborting the step: the JSON holds the
          # cost and the error either way, and the step re-exits with it below.
          set +e
          claude -p "$(cat .github/sweep-prompt.md)

          Findings from the automated source check (may be empty):
          $(cat findings.json)

          Extra focus for this run, if any: ${FOCUS:-none}" \
            --model "$SWEEP_MODEL" \
            --permission-mode acceptEdits \
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash,WebFetch,WebSearch" \
            --max-turns 60 \
            --output-format json > sweep-result.json
          CLAUDE_EXIT=$?
          set -e

          jq -r '.result // "(no summary)"' sweep-result.json
          echo "::notice title=Sweep cost::$(jq -r '"model \(env.SWEEP_MODEL) · turns \(.num_turns // "?") · $\(.total_cost_usd // "?") · \((.duration_ms // 0) / 1000 | floor)s"' sweep-result.json)"
          exit "$CLAUDE_EXIT"

      # The agent's JSON is the only record of what a failed run did and cost;
      # keep it even when the step above exits non-zero. The transcript is the
      # turn-by-turn record — two runs hit the turn cap with ~70k tokens of
      # context per turn and the totals alone could not say why.
      - name: Upload the sweep result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sweep-result
          path: |
            sweep-result.json
            /home/runner/.claude/projects/
          if-no-files-found: ignore

      # Outside the agent loop on purpose. The browser suites print hundreds of
      # lines; read back into the conversation they are billed on every later turn,
      # and the agent waits through them at model prices. Here they cost runner
      # minutes instead, and a failure stops the branch from being pushed at all.
      - name: Verify
        run: npm run verify

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "Nothing changed — no pull request. An empty week is a fine outcome."
            exit 0
          fi
          git add -A
          git commit -m "Weekly sweep: $(date -u +%Y-%m-%d)"
          git push -u origin "$BRANCH"
          # Needs Settings -> Actions -> "Allow GitHub Actions to create and approve
          # pull requests". Without it the push still lands and the branch is opened
          # by hand; the run should not fail for it.
          gh pr create \
            --title "Weekly sweep: $(date -u +%Y-%m-%d)" \
            --body-file .github/sweep-pr-body.md \
            --label source-check \
            || echo "::warning title=No PR::Branch $BRANCH pushed; Actions cannot open PRs in this repo."
