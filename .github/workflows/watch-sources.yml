name: Watch sources

# Runs the read-only source checks on a GitHub runner, which — unlike an agent
# sandbox behind an egress policy — can actually reach Hugging Face, arXiv and the
# labs' own sites. Findings land in a single reused issue rather than a new one per
# day, so the watcher cannot bury the repository in noise.
#
# Nothing here edits the atlas. Every data change still goes through a reviewed pull
# request, which is the property that makes the site worth citing.

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: watch-sources
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Run the checks
        id: checks
        # Exit 1 means "findings", which is not a workflow failure — it is the
        # normal outcome we want reported. Only a crash should fail the job.
        run: |
          set +e
          node scripts/watch/run.mjs --out report.md
          code=$?
          set -e
          if [ ! -s report.md ]; then
            echo "watcher produced no report" >&2
            exit 1
          fi
          echo "findings=$code" >> "$GITHUB_OUTPUT"

      - name: Open or update the findings issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('report.md', 'utf8');
            const TITLE = 'Source check: links, citations, config drift, new releases';
            const { owner, repo } = context.repo;

            const existing = (await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'source-check', per_page: 10,
            })).data[0];

            const findings = '${{ steps.checks.outputs.findings }}' === '1';

            if (!findings && !existing) {
              core.info('Nothing to report and no open issue. Done.');
              return;
            }

            if (existing) {
              await github.rest.issues.update({
                owner, repo, issue_number: existing.number, body,
              });
              core.info(`Updated #${existing.number}`);
              if (!findings) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: existing.number,
                  body: 'Latest run is clean — closing. It will reopen automatically if anything regresses.',
                });
                await github.rest.issues.update({
                  owner, repo, issue_number: existing.number, state: 'closed',
                  state_reason: 'completed',
                });
              }
              return;
            }

            const created = await github.rest.issues.create({
              owner, repo, title: TITLE, body, labels: ['source-check'],
            });
            core.info(`Opened #${created.data.number}`);

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-check-report
          path: report.md
          if-no-files-found: ignore
