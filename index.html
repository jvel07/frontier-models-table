<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Model Atlas</title>
    <meta
      name="description"
      content="A living reference for how frontier and small language models are built: architecture, attention mechanisms, parameter counts, context windows, training pipelines and data curricula, sourced from primary technical reports. For engineers and researchers training their own."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta property="og:title" content="The Model Atlas" />
    <meta
      property="og:description"
      content="A living map of how frontier and small language models are actually built — architecture, attention, training pipelines and data curricula, sourced from primary technical reports."
    />
    <meta property="og:image" content="./logo-512.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <style>
      /* Theme tokens. The component's style objects reference these via var(),
         so switching data-theme on <html> restyles the whole table at once.

         The palette is the industrial-terminal register: flat neutral greys, no
         warmth in the chrome, one electric blue doing all the pointing, and a
         signal green reserved for "this exists and you can have it". Dark is the
         home key — #1A1A1A page with panels recessed to #111 rather than raised,
         text at #D9D9D9 rather than white — and light is the same system turned
         over, not a different one.

         Two rules survive from the previous theme because they are what makes a
         reference table readable rather than decorative:

         1. Colour is data. The chrome — controls, rules, labels, surfaces — is
            greyscale, and every remaining hue means something: architecture
            family, model class, whether a token count was disclosed or estimated.
            A reader who notices a colour here can assume it is telling them
            something, which is not true of a palette that also tints furniture.
         2. The single spot colour, --clay, marks the active control and nothing
            decorative. It is now #03049C on light and a lifted #6E70FF on dark,
            where the deep blue would disappear into the page.

         The five architecture hues are not chosen by eye. They are checked with
         the palette validator in the dataviz skill and pass all five tests —
         lightness band, chroma floor, CVD separation, normal-vision floor and
         contrast against the surface — in both modes, which the warm palette they
         replaced did not: its worst pair collapsed to ΔE 1.8 for deuteranopes. */
      :root {
        --paper: #F4F1F8;
        --card: #FFFFFF;
        --ink: #1A1024;
        --ink-soft: #4A3E5C;
        --ink-faint: #6B5F7D;
        --line: #DCD4E8;
        --line-soft: #EBE5F3;

        /* The accent splits by surface, because the brief's yellow cannot carry
           text on white — #FCEE0C measures 1.21:1 there, against the 4.5:1 bar.
           So --accent-fill stays that yellow everywhere it is a *fill* with dark
           text on top (15:1), and --clay, which is the text-and-rule accent, is a
           deep magenta here and the yellow itself on the dark theme. */
        --clay: #A8005E;
        --clay-soft: #FBE9F2;
        --accent-fill: #FCEE0C;
        --on-clay: #1A1024;

        --row-alt: transparent;
        --row-hover: #FAF7FD;
        --row-open: #F6F1FB;
        --detail-bg: #F8F5FC;
        --dim: #9C90AE;
        --open-fg: #0A6E3C;
        --fallback: #6B5F7D;

        --tok-ok-fg: #0A6E3C;
        --tok-ok-bg: #E8F4EC;
        --tok-ok-line: #CBE5D6;
        --tok-est-fg: #8A4A0C;
        --tok-est-bg: #FBEFE2;
        --tok-est-line: #EBD6BE;

        --type-frontier-fg: #00799B;  --type-frontier-dot: #00799B;
        --type-mid-fg: #3B45C4;       --type-mid-dot: #3B45C4;
        --type-slm-fg: #0A6B36;       --type-slm-dot: #0A6B36;

        --arch-dense: #8A4A0C;
        --arch-moe: #D4157F;
        --arch-mamba: #0A6B36;
        --arch-kda: #3B45C4;
        --arch-deltanet: #00799B;
        --arch-reported: #8A6A76;
        --arch-undisclosed: #6B5F7D;

        --intel-hi: #A8005E;
        --intel-mid: #D4157F;
        --intel-lo: #D9CFE4;

        --meter-trough: #EDE7F3;
        --meter-shadow: #B9AECB;
        --meter-highlight: #FFFFFF;
        --meter-lead: #C79A00;

        --grid-line: rgba(168, 0, 94, 0.055);
        --glow: rgba(212, 21, 127, 0.10);

        --shadow: 0 1px 2px rgba(26, 16, 36, 0.06);
      }

      /* The home key: a synthwave night — deep violet-black ground, magenta glow on
         the horizon, and the brief's #FCEE0C carrying every accent. Yellow on this
         ground measures 15.6:1, which is why it can do the work here that a deep
         magenta has to do on the light theme. */
      :root[data-theme="dark"] {
        --paper: #150E1F;
        --card: #0F0A17;
        --ink: #EDE4F5;
        --ink-soft: #B9AED0;
        --ink-faint: #8F84A8;
        --line: #332448;
        --line-soft: #241834;

        --clay: #FCEE0C;
        --clay-soft: #3A3405;
        --accent-fill: #FCEE0C;
        --on-clay: #150E1F;

        --row-alt: transparent;
        --row-hover: #1C1329;
        --row-open: #211735;
        --detail-bg: #0B0712;
        --dim: #5B4E70;
        --open-fg: #3DE8A0;
        --fallback: #8F84A8;

        --tok-ok-fg: #3DE8A0;
        --tok-ok-bg: #0C2419;
        --tok-ok-line: #17402D;
        --tok-est-fg: #F0A93C;
        --tok-est-bg: #2A1D0A;
        --tok-est-line: #43301A;

        --type-frontier-fg: #22D3EE;  --type-frontier-dot: #22D3EE;
        --type-mid-fg: #8F8CFF;       --type-mid-dot: #8F8CFF;
        --type-slm-fg: #3DE8A0;       --type-slm-dot: #3DE8A0;

        --arch-dense: #C0651A;
        --arch-moe: #F53F9C;
        --arch-mamba: #0F9E50;
        --arch-kda: #5566E8;
        --arch-deltanet: #088C9E;
        --arch-reported: #A98494;
        --arch-undisclosed: #8F84A8;

        --intel-hi: #F53F9C;
        --intel-mid: #A93A8E;
        --intel-lo: #3A2A4E;

        --meter-trough: #0A0611;
        --meter-shadow: #000000;
        --meter-highlight: #4A3568;
        --meter-lead: #FCEE0C;

        --grid-line: rgba(245, 63, 156, 0.045);
        --glow: rgba(245, 63, 156, 0.20);

        --shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
      }

      html { -webkit-text-size-adjust: 100%; }
      body { margin: 0; background: var(--paper); }

      /* A scanline, at the threshold of visible. The reference theme wears a heavy
         one; this table is read for numbers, and any texture strong enough to see
         on a solid field is strong enough to moiré against 15 columns of ruled
         rows. Dark only — on the light page the same overlay reads as dirt. */
      :root[data-theme="dark"] body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 9999;
        background: repeating-linear-gradient(
          0deg, rgba(245, 63, 156, 0.020) 0 1px, transparent 1px 3px);
      }

      /* Row hover.
         ------------------------------------------------------------------
         Three things happen, in order of how much they matter: the row lifts onto
         a tinted surface, an accent rule wipes down its left edge, and the model
         name rises one character at a time.

         The stagger is the whole effect. Each character carries its index as --i
         and delays by 14ms times that, so a nine-letter name finishes its wave in
         about an eighth of a second — read as a single gesture travelling left to
         right, not as nine separate animations. The name also takes the accent
         colour, which is what tells you the row is the one you are about to open.

         Transform and colour only: no layout property changes on hover, so a
         pointer dragged down 71 rows never triggers a reflow. */
      .atlas-row { transition: background-color 140ms ease; }
      .atlas-row > td:first-child { position: relative; }
      .atlas-row > td:first-child::before {
        content: "";
        position: absolute;
        left: 0; top: 0; bottom: 0;
        width: 2px;
        background: var(--clay);
        transform: scaleY(0);
        transform-origin: top;
        transition: transform 180ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .atlas-row:hover > td:first-child::before,
      .atlas-row-open > td:first-child::before { transform: scaleY(1); }
      .atlas-row:hover { background-color: var(--row-hover) !important; }

      /* The provider mark: absent until hover, then it jumps out of the name.
         The overshoot in the easing is the jump — it passes its resting size and
         settles back. It waits for the name's character wave to finish (--n
         characters at the same 14ms step) so the two read as one gesture, first
         the name, then the mark. */
      .atlas-mark {
        display: inline-flex;
        opacity: 0;
        transform: translateX(-9px) scale(0.4);
        transition: opacity 140ms ease, transform 300ms cubic-bezier(0.18, 1.5, 0.4, 1);
      }
      .atlas-row:hover .atlas-mark {
        opacity: 1;
        transform: translateX(0) scale(1);
        transition-delay: calc(var(--n) * 14ms);
      }
      @media (prefers-reduced-motion: reduce) {
        .atlas-mark { transition-duration: 0ms !important; transition-delay: 0ms !important; }
        .atlas-row:hover .atlas-mark { transform: none; }
      }

      .atlas-char {
        display: inline-block;
        white-space: pre;
        transition: transform 220ms cubic-bezier(0.2, 0.8, 0.2, 1), color 220ms ease;
        transition-delay: calc(var(--i) * 14ms);
      }
      .atlas-row:hover .atlas-char { transform: translateY(-2px); color: var(--clay); }
      /* A search hit stays marked whether or not the row is hovered. */
      .atlas-hit { background: var(--clay-soft); border-radius: 2px; }

      /* Nothing above is load-bearing: without motion the row still tints and the
         rule still appears, they just arrive at once. */
      @media (prefers-reduced-motion: reduce) {
        .atlas-row, .atlas-char, .atlas-row > td:first-child::before {
          transition-duration: 0ms !important;
          transition-delay: 0ms !important;
        }
        .atlas-row:hover .atlas-char { transform: none; }
      }

      /* Bullets for the column tips, drawn rather than listed: a real list marker
         indents unpredictably across browsers at this size. */
      .atlas-tip-point::before { content: "–"; position: absolute; left: 0; opacity: 0.55; }

      /* Only the leader glows, and it charges rather than sitting full.
         ------------------------------------------------------------------
         The blocks fill left to right up to the row's real score, hold, and reset —
         a battery topping up. `steps(9)` is what makes them arrive one bin at a
         time instead of sliding; the width target is --fill, set per row, so the
         animation stops exactly where that model's score does rather than at 100%.
         The neon is on its own timeline, dark until the last bin lands, so the glow
         reads as "charged" rather than as decoration that happens to be blue.

         Neon on every bar would be wallpaper; on one bar per column it is
         information — that row holds the highest score in the table. */
      @keyframes atlas-charge {
        0%   { width: 0; }
        55%  { width: var(--fill); }
        92%  { width: var(--fill); }
        100% { width: 0; }
      }
      @keyframes atlas-charge-glow {
        0%, 45%  { box-shadow: none; }
        58%, 92% { box-shadow: 0 0 7px var(--meter-lead), 0 0 2px var(--meter-lead); }
        100%     { box-shadow: none; }
      }
      .atlas-meter-lead > span {
        animation: atlas-charge 3.4s steps(9, end) infinite,
                   atlas-charge-glow 3.4s ease-in-out infinite;
      }
      /* Charged and still, for readers who asked for less motion. */
      @media (prefers-reduced-motion: reduce) {
        .atlas-meter-lead > span {
          animation: none;
          box-shadow: 0 0 7px var(--meter-lead), 0 0 2px var(--meter-lead);
        }
      }

      /* The block cursor of a terminal prompt, which a real <input> caret cannot be.
         It only ever runs on an empty, unfocused field, so it is a hint that the
         thing is ready for typing rather than something blinking at you while you
         type. Stopped outright for readers who asked for less motion. */
      @keyframes atlas-blink { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }
      @media (prefers-reduced-motion: reduce) {
        .atlas-cursor { animation: none !important; }
      }
    </style>
    <script>
      // Set the theme before first paint so there is no light-to-dark flash.
      (function () {
        try {
          var saved = localStorage.getItem("fmt-theme");
          var dark = saved ? saved === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) document.documentElement.setAttribute("data-theme", "dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
