<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Model Atlas</title>
    <meta
      name="description"
      content="A living reference for how frontier and small language models are built: architecture, attention mechanisms, parameter counts, context windows, training pipelines and data curricula, sourced from primary technical reports. For engineers and researchers training their own."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta property="og:title" content="The Model Atlas" />
    <meta
      property="og:description"
      content="A living map of how frontier and small language models are actually built — architecture, attention, training pipelines and data curricula, sourced from primary technical reports."
    />
    <meta property="og:image" content="./logo-512.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <style>
      /* Theme tokens. The component's style objects reference these via var(),
         so switching data-theme on <html> restyles the whole table at once.

         The palette follows the printed technical report rather than the dashboard.
         Two rules do most of the work, both borrowed from Tufte:

         1. Off-white and off-black, never #fff on #000. Paper is #FFFEF6, ink is
            #14120E, and the pairing is what a page under a lamp actually looks like.
         2. Colour is data. The chrome — controls, rules, labels, surfaces — is
            greyscale, and every remaining hue means something: architecture family,
            model class, whether a token count was disclosed or estimated. A reader
            who notices a colour here should be able to assume it is telling them
            something, which is not true of a palette that also tints the furniture.

         The single spot colour, --clay, is the ink red of a proof correction. It
         marks the active control and nothing decorative. */
      :root {
        --paper: #FFFEF6;
        --card: #FFFEF6;
        --ink: #14120E;
        --ink-soft: #4C4740;
        --ink-faint: #7D776C;
        --line: #C7C0AD;
        --line-soft: #E4DECD;
        --clay: #8E2B12;
        --clay-soft: #EFE1D9;

        /* Zebra striping is off: alternating fills compete with the data for
           attention, and the row rules already carry the eye across. */
        --row-alt: transparent;
        --row-open: #F5F0DF;
        --detail-bg: #F8F4E7;
        --dim: #9A948A;
        --on-clay: #FFFEF6;
        --open-fg: #2F6B4F;
        --fallback: #64748b;

        --tok-ok-fg: #3F7A6A;
        --tok-ok-bg: #E6F0EB;
        --tok-ok-line: #CFE3DA;
        --tok-est-fg: #9A6A2E;
        --tok-est-bg: #F4EBD9;
        --tok-est-line: #E5D4B0;

        --type-frontier-fg: #1F6F8B;  --type-frontier-dot: #2A8BAA;
        --type-mid-fg: #6D5BA8;       --type-mid-dot: #8B79C9;
        --type-slm-fg: #3F7A5A;       --type-slm-dot: #4E9A6F;

        --arch-dense: #A8761E;
        --arch-moe: #C0397F;
        --arch-mamba: #2F8F7A;
        --arch-kda: #7A4FA3;
        --arch-deltanet: #2477A8;
        --arch-reported: #9A6A5E;
        --arch-undisclosed: #7A7770;

        --intel-hi: #C9633F;
        --intel-mid: #2A8BAA;
        --intel-lo: #A8A39A;

        --shadow: 0 1px 2px rgba(43, 42, 39, 0.04);
      }

      /* The same page under a lamp instead of daylight: one surface, no raised
         cards, warm ink on near-black rather than grey on grey. */
      :root[data-theme="dark"] {
        --paper: #13120E;
        --card: #13120E;
        --ink: #EDE7D7;
        --ink-soft: #A8A192;
        --ink-faint: #7C7568;
        --line: #3D382C;
        --line-soft: #262219;
        --clay: #D2694A;
        --clay-soft: #40291F;

        --row-alt: transparent;
        --row-open: #241E14;
        --detail-bg: #1A170F;
        --dim: #5C5952;
        --on-clay: #13120E;
        --open-fg: #6BAF87;
        --fallback: #94A3B8;

        --tok-ok-fg: #7FC4AC;
        --tok-ok-bg: #1B2E29;
        --tok-ok-line: #2C463F;
        --tok-est-fg: #D4A45C;
        --tok-est-bg: #2E2718;
        --tok-est-line: #473C25;

        --type-frontier-fg: #5FB4D4;  --type-frontier-dot: #45A8CC;
        --type-mid-fg: #A797E0;       --type-mid-dot: #9A8AD4;
        --type-slm-fg: #6BAF87;       --type-slm-dot: #62B88A;

        --arch-dense: #D2A343;
        --arch-moe: #E86BAB;
        --arch-mamba: #4FC0A6;
        --arch-kda: #A87FD4;
        --arch-deltanet: #55A9D8;
        --arch-reported: #C2938A;
        --arch-undisclosed: #A3A099;

        --intel-hi: #E5895F;
        --intel-mid: #45A8CC;
        --intel-lo: #5C5952;

        --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
      }

      html { -webkit-text-size-adjust: 100%; }
      body { margin: 0; background: var(--paper); }
    </style>
    <script>
      // Set the theme before first paint so there is no light-to-dark flash.
      (function () {
        try {
          var saved = localStorage.getItem("fmt-theme");
          var dark = saved ? saved === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) document.documentElement.setAttribute("data-theme", "dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
